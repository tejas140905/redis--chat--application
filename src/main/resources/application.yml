server:
  # Port 8080 locally and under Docker Compose; Render and other PaaS platforms
  # inject PORT (Render's default is 10000), so honour it when present.
  port: ${PORT:8080}

spring:
  application:
    name: chat-app
  data:
    redis:
      # Local default. Overridden by SPRING_DATA_REDIS_HOST / _PORT (Compose sets the
      # host to "redis"). When SPRING_DATA_REDIS_URL is set, Spring ignores host/port
      # and uses the URL instead - that is how Render Key Value is wired in render.yaml.
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,redis
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Logging
logging:
  level:
    com.freightfox.chatapp: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application specific
app:
  chat:
    # Messages kept per room; older entries are trimmed from the Redis list
    max-history-limit: 100
    # Default for GET .../messages when ?limit is omitted
    default-history-limit: 50
    # Server-Sent Events: how long a stream may stay open, and heartbeat interval
    sse-timeout-ms: 1800000
    sse-heartbeat-ms: 15000